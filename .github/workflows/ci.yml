name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 语法检查
        run: python3 -m py_compile server.py

      - name: 前端 JS 语法检查
        run: |
          python3 - <<'PY' > /tmp/inline.js
          import re
          s = open('index.html', encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))
          PY
          node --check /tmp/inline.js && echo "inline JS OK"

      - name: 冒烟测试（起服务 + 打接口）
        run: bash scripts/smoke.sh 17101
